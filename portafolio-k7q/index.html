<link rel="apple-touch-icon" href="../assets/img/favicon.png">

<style>
/* Carga de tipografía oficial DIN Pro desde el proyecto */
@font-face {
  font-family: 'DIN Pro';
  src: url('../assets/fonts/DINPro-Light.woff2') format('woff2');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'DIN Pro';
  src: url('../assets/fonts/DINPro-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'DIN Pro';
  src: url('../assets/fonts/DINPro-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

/* ===== Tokens de marca AgenciArena (proporción del mailing: negro dominante, amarillo de acento) ===== */
:root{
  --amarillo:#FFDD00;
  --negro:#000000;
  --blanco:#FFFFFF;
  --texto-suave:#D6D6D6;
  --gris:#A8A8A8;
  --linea:#262626;
  --tarjeta:#161616;
  --tipo:"DIN Pro","DIN","D-DIN","Barlow",Arial,Helvetica,sans-serif;
  --ancho:1240px;
  --gutter:clamp(16px,4vw,48px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px;background:var(--negro)}
body{margin:0;background:var(--negro);color:var(--blanco);font-family:var(--tipo);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,video{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Acceso ===== */
.acceso{position:fixed;inset:0;z-index:50;background:var(--negro);display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;padding:var(--gutter)}
.acceso[hidden]{display:none}
.acceso form{width:100%;max-width:380px}
.acceso img{width:190px;margin-bottom:40px}
.acceso h1{font-size:30px;font-weight:300;line-height:1.1;margin:0 0 10px}
.acceso h1 b{font-weight:700;color:var(--amarillo)}
.acceso p{margin:0 0 24px;color:var(--texto-suave)}
.acceso label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.acceso .fila{display:flex;gap:8px}
.acceso input{flex:1;min-width:0;font:inherit;padding:12px 16px;border:0;border-radius:40px;background:var(--blanco);color:var(--negro)}
.acceso button{font:inherit;font-weight:700;padding:12px 24px;border:0;border-radius:40px;background:var(--amarillo);color:var(--negro);cursor:pointer}
.acceso .error{min-height:24px;margin-top:10px;font-size:15px;font-weight:600;color:var(--amarillo)}

/* ===== Hero ===== */
.hero{background:var(--negro);overflow:hidden}
.hero .marco{max-width:var(--ancho);margin:0 auto;padding:40px var(--gutter) 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px;align-items:center;min-height:min(84vh,720px)}
.hero .logo{width:160px;grid-column:1/-1;justify-self:end;align-self:start;margin-bottom:24px}
.hero h1{font-size:clamp(44px,5.8vw,80px);line-height:.95;font-weight:300;letter-spacing:-.02em;margin:0 0 32px}
.hero h1 span{display:block}
.hero h1 .acento{font-weight:700;color:var(--amarillo)}
.hero .bajada{font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:var(--texto-suave);max-width:42ch;margin:0}
.puntos{position:relative;aspect-ratio:1/1;width:100%;max-width:520px;justify-self:end}
.punto{position:absolute;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:var(--amarillo)}
.punto img{width:100%;height:100%;object-fit:cover}
/* Proporciones tomadas del isotipo */
.p1{width:53%;left:15%;top:6%;box-shadow:0 0 0 6px var(--amarillo)}
.p2{width:32%;left:57%;top:40%;box-shadow:0 0 0 5px var(--amarillo)}
.p3{width:9.5%;left:23%;top:60%}
.p4{width:17%;left:40%;top:76%;box-shadow:0 0 0 4px var(--amarillo)}
@media (prefers-reduced-motion:no-preference){
  .punto{animation:cae .9s cubic-bezier(.2,.9,.25,1.15) both}
  .p1{animation-delay:.1s}.p2{animation-delay:.3s}.p3{animation-delay:.45s}.p4{animation-delay:.6s}
  @keyframes cae{from{transform:translateY(-60px) scale(.4);opacity:0}to{transform:none;opacity:1}}
}
/* Trama de puntos (misma que el mailing) */
.trama{display:block;width:100%;height:clamp(84px,8.4vw,120px)}

/* ===== Navegación por cliente ===== */
.nav{position:sticky;top:0;z-index:20;background:var(--negro);border-bottom:1px solid var(--linea)}
.nav .marco{max-width:var(--ancho);margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;gap:24px;height:60px;overflow-x:auto;scrollbar-width:none}
.nav .marco::-webkit-scrollbar{display:none}
.nav img{width:96px;flex:none}
.nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.nav a{display:block;white-space:nowrap;text-decoration:none;font-weight:600;font-size:15px;padding:7px 14px;border-radius:40px;color:var(--blanco)}
.nav a:hover{background:var(--linea)}
.nav a[aria-current="true"]{background:var(--amarillo);color:var(--negro)}

/* ===== Secciones de cliente ===== */
.cliente{max-width:var(--ancho);margin:0 auto;padding:88px var(--gutter) 24px}
.cliente header{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px 48px;align-items:start;margin-bottom:40px}
.cliente h2{font-size:clamp(34px,4.4vw,56px);font-weight:700;line-height:1;letter-spacing:-.015em;margin:0}
.cliente .periodo{display:block;font-size:17px;font-weight:300;letter-spacing:0;margin-top:12px;color:var(--amarillo)}
.cliente .alcance{margin:0;font-size:18px;line-height:1.6;color:var(--texto-suave);max-width:56ch}
.cliente .marcas{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px 18px}
.cliente .marcas li{font-size:15px;display:flex;align-items:center;gap:8px}
.cliente .marcas li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--amarillo);flex:none}

.grilla{columns:4 260px;column-gap:20px}
.pieza{break-inside:avoid;margin:0 0 28px}
.pieza button{all:unset;display:block;width:100%;cursor:zoom-in;position:relative;border-radius:4px;overflow:hidden;background:var(--tarjeta)}
.pieza button:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}
.pieza img{width:100%;height:auto;transition:transform .5s ease}
.pieza button:hover img{transform:scale(1.025)}
.pieza figcaption{padding-top:10px;font-size:15px;line-height:1.35}
.pieza .titulo{font-weight:600;display:block}
.pieza .meta{color:var(--gris)}
.play{position:absolute;left:12px;bottom:12px;width:48px;height:48px;border-radius:50%;background:var(--amarillo);display:grid;place-items:center}
.play svg{width:18px;margin-left:3px}

/* ===== Cierre ===== */
/* Huincha legal */
.cierre{margin-top:72px}
.cierre .bloque{background:var(--amarillo);color:var(--negro)}
.cierre .bloque p{max-width:var(--ancho);margin:0 auto;padding:12px var(--gutter);font-size:13px;line-height:1.4;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){.cierre .bloque p{white-space:normal;font-size:12px}}

/* ===== Visor ===== */
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.97);color:var(--blanco);display:grid;grid-template-rows:1fr auto;padding:56px 72px 20px}
.lightbox[hidden]{display:none}
.lightbox .medio{position:relative;display:grid;place-items:center;min-height:0}
.lightbox .medio img,.lightbox .medio video{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;user-select:none;-webkit-user-drag:none}
.lightbox .sello{position:absolute;right:12px;bottom:12px;font-size:12px;font-weight:600;color:rgba(255,255,255,.55);pointer-events:none}
.lightbox .pie{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding-top:14px;font-size:16px}
.lightbox .pie .meta{color:#aaa}
.lightbox .ctrl{position:absolute;border:0;background:transparent;color:var(--blanco);cursor:pointer;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.lightbox .ctrl:hover{background:#222}
.lightbox .ctrl svg{width:26px}
.lightbox .cerrar{top:6px;right:10px}
.lightbox .ant{left:10px;top:50%;transform:translateY(-50%)}
.lightbox .sig{right:10px;top:50%;transform:translateY(-50%)}

@media (max-width:860px){
  .hero .marco{grid-template-columns:1fr;padding-top:28px;min-height:auto;gap:8px}
  .hero .logo{width:130px;margin-bottom:32px}
  .puntos{max-width:300px;justify-self:center;margin-top:32px}
  .cliente header{grid-template-columns:1fr}
  .grilla{columns:2 150px;column-gap:14px}
  .lightbox{padding:56px 8px 16px}
  .lightbox .ant,.lightbox .sig{top:auto;bottom:-6px;transform:none}
  .lightbox .pie{padding:14px 60px 0;flex-direction:column;gap:2px;text-align:center;align-items:center}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.pieza img{transition:none}}
</style>
</head>

async function hashClave(t){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
window.hashClave=hashClave;

function guardar(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function leer(k){try{return sessionStorage.getItem(k)}catch(e){return null}}

const acceso=document.getElementById("acceso"),contenido=document.getElementById("contenido");
function abrir(){acceso.hidden=true;contenido.hidden=false;construir()}

document.getElementById("form-acceso").addEventListener("submit",async e=>{

});

/* Trama de puntos amarillos: crecen hacia abajo, con ondas, como en el mailing */
function dibujarTrama(){
  const svg=document.getElementById("trama"),paso=15,cols=96,filas=8,W=cols*paso,H=filas*paso;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("preserveAspectRatio","xMidYMax slice");
  let c="";
  for(let f=0;f<filas;f++)for(let k=0;k<cols;k++){
    const onda=(Math.sin(k*.21+f*.5)+Math.sin(k*.07-f*.3)+2)/4;
    const r=Math.max(.6,((f+1)/filas)*(1.2+onda*4.6));
    c+=`<circle cx="${k*paso+paso/2}" cy="${f*paso+paso/2}" r="${r.toFixed(2)}"/>`;
  }
  svg.innerHTML=`<g fill="#FFDD00">${c}</g>`;
}

let construido=false,orden=[];
function construir(){
  if(construido)return;construido=true;
  document.getElementById("credito").textContent=CREDITO;
  dibujarTrama();
  const nav=document.getElementById("nav-clientes"),cont=document.getElementById("clientes");
  CLIENTES.forEach(c=>{
    const piezas=PIEZAS.filter(p=>p.cliente===c.id);
    nav.insertAdjacentHTML("beforeend",`<li><a href="#${c.id}">${c.nombre}</a></li>`);
    const sec=document.createElement("section");sec.className="cliente";sec.id=c.id;sec.setAttribute("aria-labelledby","t-"+c.id);
    sec.innerHTML=`<header><h2 id="t-${c.id}">${c.nombre}<span class="periodo">${c.periodo}</span></h2>
      <div><p class="alcance">${c.alcance}</p><ul class="marcas">${c.marcas.map(m=>`<li>${m}</li>`).join("")}</ul></div></header>
      <div class="grilla"></div>`;
    const g=sec.querySelector(".grilla");
    piezas.forEach(p=>{
      const n=orden.push(p)-1;
      g.insertAdjacentHTML("beforeend",`<figure class="pieza"><button data-n="${n}" aria-label="Ver ${p.titulo}">
        <img src="${p.thumb}" width="${p.w}" height="${p.h}" loading="lazy" alt="${p.titulo}" draggable="false">
        ${p.video?'<span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>':""}
        </button><figcaption><span class="titulo">${p.titulo}</span><span class="meta">${p.tipo}, ${p.anio}</span></figcaption></figure>`);
    });
    cont.appendChild(sec);
  });
  cont.addEventListener("click",e=>{const b=e.target.closest("button[data-n]");if(b)verPieza(+b.dataset.n,b)});
  // Resaltar el cliente visible en la barra
  const links=[...nav.querySelectorAll("a")];
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)links.forEach(a=>a.setAttribute("aria-current",a.hash==="#"+en.target.id))}),{rootMargin:"-40% 0px -55% 0px"});
  document.querySelectorAll(".cliente").forEach(s=>io.observe(s));
}

// Disuasión básica: sin menú contextual ni arrastre sobre las piezas
document.addEventListener("contextmenu",e=>{if(e.target.closest(".pieza,.lightbox .medio"))e.preventDefault()});

/* ===== Visor ===== */
const visor=document.getElementById("visor"),medio=document.getElementById("visor-medio");
let actual=0,origen=null;
function pintar(){
  const p=orden[actual],c=CLIENTES.find(c=>c.id===p.cliente);
  medio.innerHTML=(p.video
    ?`<video src="${p.video}" poster="${p.thumb}" controls autoplay playsinline controlslist="nodownload" disablepictureinpicture></video>`
    :`<img src="${p.img}" alt="${p.titulo}" draggable="false">`)+`<span class="sello">AgenciArena · uso confidencial</span>`;
  document.getElementById("visor-titulo").textContent=p.titulo;
  document.getElementById("visor-meta").textContent=`${c.nombre}, ${p.tipo}, ${p.anio}`;
}
function verPieza(n,btn){origen=btn;actual=n;pintar();visor.hidden=false;document.body.style.overflow="hidden";document.getElementById("v-cerrar").focus()}
function cerrar(){visor.hidden=true;medio.innerHTML="";document.body.style.overflow="";if(origen)origen.focus()}
function mover(d){actual=(actual+d+orden.length)%orden.length;pintar()}
document.getElementById("v-cerrar").onclick=cerrar;
document.getElementById("v-ant").onclick=()=>mover(-1);
document.getElementById("v-sig").onclick=()=>mover(1);
visor.addEventListener("click",e=>{if(e.target===visor||e.target===medio)cerrar()});
document.addEventListener("keydown",e=>{if(visor.hidden)return;
  if(e.key==="Escape")cerrar();if(e.key==="ArrowLeft")mover(-1);if(e.key==="ArrowRight")mover(1);
  if(e.key==="Tab"){const f=[...visor.querySelectorAll("button,video")];const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}});
let x0=null;visor.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
visor.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)mover(dx<0?1:-1);x0=null});
</script>
